name: ci-verify

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-verify:
    name: ci-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: PR chronology gate
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-pr-chronology.mjs

      - name: PR shape gate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          MOUSECAT_GITOPS_TRACE: "1"
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch origin "${BASE_REF}" --depth=1 || true
          node .github/scripts/check-pr-shape.mjs --base "origin/${BASE_REF}" --write-trace

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Run PR readiness surface
        run: npm run pr:ready

      - name: Verify public history boundary
        run: npm run release:check

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Upload CI governance artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-verify-governance-artifacts
          path: |
            npm-debug.log
            *.log
            .mousecat/data/gitops/pr-classifications
          if-no-files-found: ignore

  node-20-compat:
    name: node-20-compat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Runtime compatibility tests
        run: npm test

  browser-contracts:
    name: browser-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify synthetic operator clickthroughs
        run: npm run test:browser
      - name: Upload synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operator-browser-contracts
          path: .mousecat/browser-check
          if-no-files-found: ignore
