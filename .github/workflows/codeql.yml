name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '23 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:javascript"
          output: .mousecat/codeql
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      - name: Retain private validation report
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-private-validation
          path: .mousecat/codeql/*.sarif
          if-no-files-found: error
