name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review, labeled, unlabeled ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node-${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: PR chronology gate
        if: ${{ github.event_name == 'pull_request' && matrix.node-version == '22' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-pr-chronology.mjs

      - name: PR shape gate
        if: ${{ github.event_name == 'pull_request' && matrix.node-version == '22' }}
        shell: bash
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch origin "${BASE_REF}" --depth=1 || true
          node .github/scripts/check-pr-shape.mjs --base "origin/${BASE_REF}"

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Run PR readiness surface
        run: npm run pr:ready

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Upload logs artifact (on demand)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-node-${{ matrix.node-version }}
          path: |
            npm-debug.log
            *.log
          if-no-files-found: ignore
