<!doctype html>
<html lang="en" class="native-detached-page" data-theme="manuscript">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulation · Mousecat</title>
    <script src="/appearance.js"></script>
    <link rel="stylesheet" href="/operator.css">
    <link rel="stylesheet" href="/native-view.css">
    <link rel="stylesheet" href="/appearance.css">
  </head>
  <body class="native-detached-body">
    <main class="native-detached-shell" aria-label="Detached simulation feed">
      <div class="native-detached-feed" data-native-feed-root>
        <p class="native-empty" data-native-waiting>Opening the selected feed.</p>
      </div>
      <footer class="native-detached-status">
        <strong data-native-state role="status"></strong>
        <span data-native-clock></span>
        <span data-native-rate></span>
        <p data-native-command></p>
      </footer>
    </main>
  </body>
</html>
