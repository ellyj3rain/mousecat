workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

stages:
  - verify
  - security
  - package

variables:
  GIT_DEPTH: "0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

default:
  image: node:22-bookworm-slim
  tags:
    - zero-local
    - open-ground
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline

ci-verify:
  stage: verify
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
  script:
    - npm run pr:ready

merge-request-shape:
  stage: verify
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates
    - rm -rf /var/lib/apt/lists/*
  rules:
    - if: $CI_MERGE_REQUEST_IID
  script:
    - git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}" --depth=50
    - node .github/scripts/check-pr-shape.mjs --base "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}" --write-trace
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .mousecat/data/gitops/pr-classifications/

node-20-compat:
  stage: verify
  image: node:20-bookworm-slim
  script:
    - npm test

dependency-scan:
  stage: security
  script:
    - npm audit --audit-level=high

package-dry-run:
  stage: package
  script:
    - npm run cd:dry-run
